spring.application.name=backend

# Runtime : URL poolée
spring.datasource.url=${DATABASE_URL_POOLED}&prepareThreshold=0
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Pool Hikari : petit, car Neon peut se mettre en veille
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Setup des variables d'env
spring.config.import=optional:file:.env[.properties]
server.port=8080


# Migrations (si Flyway) : URL directe, non poolée
spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${DATABASE_USERNAME}
spring.flyway.password=${DATABASE_PASSWORD}

#Taille des fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Neon Auth
neon.auth.url=https://ep-square-band-b9tn9qna.neonauth.c-7.eu-central-1.aws.neon.tech/neondb/auth

#worlde
minigames.wordle.seed=20240601